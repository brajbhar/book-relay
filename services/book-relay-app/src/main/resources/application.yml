server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: book-relay-app
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:book_relay};encrypt=true;trustServerCertificate=true
    username: dev_user
    password: ${DEV_USER_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

jwt:
  secret: ${JWT_SECRET:book-relay-dev-secret-change-in-production-min-32-chars}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
